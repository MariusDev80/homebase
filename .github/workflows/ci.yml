name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repository. No secrets are used.
permissions:
  contents: read

# One run per ref. Superseded runs are cancelled, except on main where every
# push keeps its own run so the history stays complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Single job for checks + build: on Windows the expensive parts are the npm
  # install and the Rust compilation. Splitting would pay for them twice
  # (clippy, test and tauri build share the same target/ cache).
  verify:
    name: Lint, test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target

      # --ignore-scripts: better-sqlite3 ships win32-x64 prebuilds but npm still runs an
      # implicit `node-gyp rebuild` (binding.gyp present), which needs Python + C++ tooling.
      # No dependency needs a lifecycle script here (also a supply-chain hardening).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prettier (format check)
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Front tests
        run: npm run test

      - name: Rust format check
        run: npm run rust:fmt:check

      - name: Clippy
        run: npm run rust:lint

      - name: Rust tests
        run: npm run rust:test

      - name: Build (unsigned installers)
        run: npm run build

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebase-windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  # Separate job: a new advisory published today must not hide the result of
  # the lint/test/build job, and it must not slow it down. It still fails
  # visibly (red check) when a high/critical advisory affects the lockfiles.
  # Audits read lockfiles only, so Linux is enough (faster and cheaper).
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Production dependencies only: that is what ships in the app (and what
      # could be exploited in the WebView). Dev tooling advisories are reported
      # in the next, non-blocking step instead of blocking every PR.
      - name: npm audit (production, blocking)
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit (all dependencies, informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: apps/desktop/src-tauri
        run: cargo audit
