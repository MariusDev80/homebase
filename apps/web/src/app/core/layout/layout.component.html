<div class="flex min-h-screen flex-col bg-page text-fg">
  <header class="topbar">
    <span class="font-semibold">{{ 'app.name' | transloco }}</span>

    <nav [attr.aria-label]="'layout.mainNav' | transloco" class="underline-nav">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        class="underline-nav-item"
      >
        <i class="pi pi-th-large mr-2 text-fg-muted" aria-hidden="true"></i>
        {{ 'nav.dashboard' | transloco }}
      </a>
      <a
        routerLink="/settings"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        class="underline-nav-item"
      >
        <i class="pi pi-cog mr-2 text-fg-muted" aria-hidden="true"></i>
        {{ 'nav.settings' | transloco }}
      </a>
    </nav>

    <button
      type="button"
      data-testid="theme-toggle"
      (click)="theme.cycle()"
      [attr.aria-label]="
        'theme.toggle' | transloco: { mode: 'theme.mode.' + theme.mode() | transloco }
      "
      class="btn btn-invisible"
    >
      <i [class]="themeIcon()" class="text-fg-muted" aria-hidden="true"></i>
      {{ 'theme.mode.' + theme.mode() | transloco }}
    </button>
  </header>

  <main class="flex-1 p-4 md:p-6">
    <router-outlet />
  </main>
</div>
