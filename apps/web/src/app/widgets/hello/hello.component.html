<p class="text-base font-semibold" data-testid="hello-greeting">
  {{ 'widgets.hello.greeting' | transloco: { name: ctx.config().name } }}
</p>
<form class="mt-3 flex items-center gap-2" (submit)="submit($event, nameInput.value)">
  <label for="hello-name-{{ ctx.instanceId }}" class="sr-only">
    {{ 'widgets.hello.nameLabel' | transloco }}
  </label>
  <input
    #nameInput
    id="hello-name-{{ ctx.instanceId }}"
    type="text"
    class="field min-w-0 flex-1"
    data-testid="hello-name"
    [value]="ctx.config().name"
    [attr.aria-invalid]="invalid()"
  />
  <button type="submit" class="btn">
    {{ 'widgets.hello.save' | transloco }}
  </button>
</form>
@if (invalid()) {
  <p role="alert" class="field-error" data-testid="hello-error">
    {{ 'widgets.hello.invalidName' | transloco }}
  </p>
}
