# cargo-audit configuration (read from <project>/.cargo/audit.toml when run in this directory).
# Every ignored advisory must be justified, dated and have a removal condition.

[advisories]
ignore = [
    # RUSTSEC-2026-0459 (CVE-2026-119375, 6.8, local): libsqlite3-sys 0.30.1 bundles SQLite < 3.54.0, which
    # can return uninitialized memory when a database is opened together with a crafted sibling -wal file
    # whose page size differs. Path: tauri-plugin-sql 2.6.0 -> sqlx 0.8.6 -> sqlx-sqlite -> libsqlite3-sys.
    # The `homebase` crate also depends directly on sqlx (modules `schedule` and `backup`), not only
    # through tauri-plugin-sql. The justification holds for both: they open only the app's own database
    # file (`create_if_missing(false)`), and a restored archive may only contain manifest.json, the
    # database and images: any -wal/-shm/-journal entry is refused (`is_allowed_name` in
    # backup/archive.rs, used by the restore validation in backup/restore.rs). So an attacker-crafted
    # db+wal pair cannot reach SQLite. Mono-user, no network access to the database.
    # Fix needs libsqlite3-sys >= 0.39 (sqlx 0.9); only tauri-plugin-sql 3.0.0-alpha.3 (major, alpha) exists.
    # Added 2026-11-16. Remove when a stable tauri-plugin-sql pulls libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",

    # RUSTSEC-2023-0071 (Marvin attack on rsa 0.9.10, 5.9, no upstream fix): rsa is only in Cargo.lock
    # through sqlx-mysql (sqlx-macros-core, unused MySQL driver). `cargo tree -i rsa --target all -e all`
    # prints nothing: it is not compiled for any target, so it is not in the binary. Homebase does no RSA.
    # Added 2026-11-16. Remove when sqlx/tauri-plugin-sql no longer lock sqlx-mysql or rsa >= 0.10 is released.
    "RUSTSEC-2023-0071",
]
