[package]
name = "homebase"
version = "0.0.0"
description = "Homebase personal dashboard"
authors = ["MariusDev80"]
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "homebase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jiff = "0.2"
rfd = { version = "0.16.0", default-features = false, features = ["common-controls-v6"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
